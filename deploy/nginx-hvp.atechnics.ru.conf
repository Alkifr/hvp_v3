# HTTPS: https://hvp.atechnics.ru
# На Astra обычно: sudo cp этого файла в /etc/nginx/conf.d/hvp.atechnics.ru.conf
# Сертификат сначала самоподписанный (предупреждение в браузере), потом заменить на УЦ.

server {
    listen 80;
    listen [::]:80;
    server_name hvp.atechnics.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hvp.atechnics.ru;

    ssl_certificate     /etc/ssl/certs/hvp.atechnics.ru.crt;
    ssl_certificate_key /etc/ssl/private/hvp.atechnics.ru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
