# Полный стенд: Postgres + API + nginx (один origin).
# Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build

name: hvp-stack

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hangar_planning
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: hangar
    volumes:
      - hangar_stack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar -d hangar_planning"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_CLOUD_URL: ${STACK_DATABASE_URL:-postgresql://hangar:hangar@db:5432/hangar_planning?schema=public}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 24 chars)}
      TZ: ${TZ:-Europe/Moscow}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${HVP_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  hangar_stack_pgdata:
